version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: job_scheduler_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: job_scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: job_scheduler_api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/job_scheduler?schema=public
      JWT_SECRET: super-secret-jwt-key-production-32-chars-minimum
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: job_scheduler_worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/job_scheduler?schema=public
      WORKER_NAME: worker-node-1
      WORKER_CONCURRENCY: 5
      POLL_INTERVAL_MS: 1000
      LEASE_DURATION_SECONDS: 30
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: job_scheduler_web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
