services:
  # 1. API Control Plane Web Service
  - type: web
    name: schedx-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run dev:api
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true

  # 2. Background Polling Worker Daemon
  - type: worker
    name: schedx-worker
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run dev:worker
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db

  # 3. Ant Design Web Dashboard Static Site
  - type: web
    name: schedx-dashboard
    env: static
    buildCommand: npm install && npm run build --workspace=@job-scheduler/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: schedx-api
          property: host
